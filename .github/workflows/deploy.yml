name: Deploy prod to ChocoLeaf

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chocoleaf-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod' && github.repository == 'dobreia/chocoleaf2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Check deployment safety
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Test backend with an isolated database
        env:
          NODE_ENV: test
        run: node --test --test-concurrency=1 test/*.test.cjs
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          NODE_ENV=test npm test
          npm run build
      - name: Package the tested commit
        run: python3 deploy/package.py "$GITHUB_SHA" "$RUNNER_TEMP/release.tar.gz"
      - name: Check that this is still the newest prod commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq .object.sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer prod commit exists; this older run will not deploy.'
          fi
      - name: Deploy over restricted SSH
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set the DEPLOY_HOST repository secret}"
          : "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY repository secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS repository secret}"
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/chocoleaf-ssh.XXXXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          options=(-T -p 22 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i "$ssh_dir/key")
          ssh "${options[@]}" "chocoleaf-deploy@$DEPLOY_HOST" "upload $GITHUB_SHA" < "$RUNNER_TEMP/release.tar.gz"
          ssh "${options[@]}" "chocoleaf-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
